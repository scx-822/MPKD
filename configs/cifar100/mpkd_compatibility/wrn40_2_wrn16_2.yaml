EXPERIMENT:
  NAME: ""
  TAG: "mpkd,dkd,tune2,wrn40_2_wrn16_2"
  PROJECT: "cifar100_compatibility"
  METHOD: "DKD-MPKD"
  BASELINE: "DKD"
DATASET:
  TYPE: "cifar100"
  NUM_WORKERS: 0
  TEST: {BATCH_SIZE: 64}
DISTILLER:
  TYPE: "MPKD"
  TEACHER: "wrn_40_2"
  STUDENT: "wrn_16_2"
SOLVER:
  BATCH_SIZE: 64
  EPOCHS: 240
  LR: 0.05
  LR_DECAY_STAGES: [150, 180, 210]
  LR_DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0005
  MOMENTUM: 0.9
  TYPE: "SGD"
  TRAINER: "crld"
KD: {TEMPERATURE: 4, LOSS: {CE_WEIGHT: 0.1, KD_WEIGHT: 0.9}}
DKD: {CE_WEIGHT: 1.0, ALPHA: 1.0, BETA: 8.0, T: 4.0, WARMUP: 20}
NKD:
  LOSS: {CE_WEIGHT: 1.0, KD_WEIGHT: 1.0}
  T: 1.0
  GAMMA: 1.5
MPKD:
  BASE_METHOD: "DKD"
  # Match the established WRN40-2 -> WRN16-2 CRLD view settings.
  WV_WEIGHT: 1.0
  CV_WEIGHT: 0.1
  TAU_W: 0.8
  TAU_S: 0.6
  PROTO_ENABLED: true
  PROTO_FUSION_MODE: "gated"
  PROTO_FUSION_SCALE: 0.5
  PROTO_TEMP: 0.5
  PROTO_TAU_W: 0.8
  PROTO_K: 3
  PROTO_MAX_SAMPLES_PER_CLASS: 0
  PROTO_GATE_UNCERTAINTY: true
  PROTO_GATE_AGREEMENT: true
  PROTO_GATE_POSITIVE_GAIN: true
  PROTO_GATE_CONFIDENCE: true
