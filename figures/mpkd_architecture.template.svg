<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-labelledby="title desc">
  <title id="title">MPKD method architecture</title>
  <desc id="desc">Weak and strong views feed a frozen teacher and trainable student. A fixed multi-center prototype bank guides gated reconstruction of only the strong-view teacher target.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334353"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#73568E"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#C44C4E"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#202E3A}
      .head{font-size:26px;font-weight:700}.lane{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#617080}.tiny{font-size:13px;fill:#617080}.math{font-size:17px;font-weight:600}
      .flow{fill:none;stroke:#334353;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-ink)}
      .rail{fill:none;stroke:#334353;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .proto-flow{fill:none;stroke:#73568E;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-purple)}
      .proto-rail{fill:none;stroke:#73568E;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .red-flow{fill:none;stroke:#C44C4E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-red)}
      .rule{stroke:#DAE1E5;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1700" height="700" fill="#FFFFFF"/>

  <!-- Headings are quiet wayfinding labels, not large panels. -->
  <g id="heading">
    <text x="48" y="52" class="head">MPKD</text>
    <text x="162" y="50" class="small">Multi-center prototype knowledge distillation</text>
    <path d="M48 67H1652" class="rule"/>
  </g>

  <!-- Connectors are below the editable modules. The view bus means both views enter both networks. -->
  <g id="connectors">
    <path d="M180 325H211V198H244" class="flow"/>
    <path d="M211 325V463H244" class="flow"/>
    <path d="M376 198H425V230H466" class="flow"/>
    <path d="M376 463H425V423H466" class="flow"/>
    <path d="M425 230V423" class="rail"/>
    <path d="M661 214H713" class="flow"/>
    <path d="M661 428H713" class="flow"/>
    <path d="M565 167V117H1060" class="proto-flow" stroke-dasharray="7 6"/>
    <path d="M661 285H1000V309H1060" class="proto-flow"/>
    <path d="M1170 177V258" class="proto-flow"/>
    <path d="M1250 309H1279" class="proto-flow"/>
    <path d="M1440 309H1461" class="proto-flow"/>
    <path d="M1559 360V487" class="red-flow"/>
  </g>

  <g id="views">
    <g id="input-view"><text x="112" y="250" text-anchor="middle" class="label">Input</text><rect x="47" y="259" width="134" height="134" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="2"/><image x="50" y="262" width="128" height="128" xlink:href="__INPUT_IMAGE__"/></g>
    <g id="weak-view"><text x="310" y="124" text-anchor="middle" class="label">Weak view</text><rect x="243" y="132" width="134" height="134" fill="#FFFFFF" stroke="#9CB9A9" stroke-width="2"/><image x="246" y="135" width="128" height="128" xlink:href="__WEAK_IMAGE__"/></g>
    <g id="strong-view"><text x="310" y="389" text-anchor="middle" class="label">Strong view</text><rect x="243" y="397" width="134" height="134" fill="#FFFFFF" stroke="#D9A4A2" stroke-width="2"/><image x="246" y="400" width="128" height="128" xlink:href="__STRONG_IMAGE__"/></g>
  </g>

  <g id="networks">
    <g id="frozen-teacher"><rect x="466" y="167" width="195" height="126" rx="5" fill="#EDF4EF" stroke="#477B60" stroke-width="2.5"/><text x="563" y="220" text-anchor="middle" class="lane" fill="#32634B">Teacher</text><text x="563" y="250" text-anchor="middle" class="small">frozen</text></g>
    <g id="student"><rect x="466" y="375" width="195" height="126" rx="5" fill="#EDF4FB" stroke="#4B7FA9" stroke-width="2.5"/><text x="563" y="428" text-anchor="middle" class="lane" fill="#2D6796">Student</text><text x="563" y="458" text-anchor="middle" class="small">trainable</text></g>
  </g>

  <!-- Original predictions are compact editable bar charts. -->
  <g id="teacher-outputs">
    <g id="teacher-weak-target"><text x="766" y="159" text-anchor="middle" class="small">Weak target</text><rect x="713" y="175" width="107" height="83" rx="4" fill="#EFF5F9" stroke="#5D90B6" stroke-width="1.8"/><path d="M728 246V226H741V246ZM748 246V211H761V246ZM768 246V186H781V246ZM788 246V222H801V246Z" fill="#5B90B8"/><text x="766" y="282" text-anchor="middle" class="math">p_w^T</text></g>
    <g id="teacher-strong-target"><text x="896" y="159" text-anchor="middle" class="small">Strong target</text><rect x="843" y="175" width="107" height="83" rx="4" fill="#FFF2F2" stroke="#C88989" stroke-width="1.8"/><path d="M858 246V221H871V246ZM878 246V203H891V246ZM898 246V191H911V246ZM918 246V215H931V246Z" fill="#C87474"/><text x="896" y="282" text-anchor="middle" class="math">p_s^T</text></g>
  </g>
  <g id="student-outputs">
    <g id="student-weak-output"><text x="766" y="376" text-anchor="middle" class="small">Weak logits</text><rect x="713" y="391" width="107" height="83" rx="4" fill="#EFF5F9" stroke="#5D90B6" stroke-width="1.8"/><path d="M728 462V441H741V462ZM748 462V425H761V462ZM768 462V402H781V462ZM788 462V435H801V462Z" fill="#5B90B8"/><text x="766" y="498" text-anchor="middle" class="math">z_w^S</text></g>
    <g id="student-strong-output"><text x="896" y="376" text-anchor="middle" class="small">Strong logits</text><rect x="843" y="391" width="107" height="83" rx="4" fill="#FFF2F2" stroke="#C88989" stroke-width="1.8"/><path d="M858 462V444H871V462ZM878 462V427H891V462ZM898 462V411H911V462ZM918 462V421H931V462Z" fill="#C87474"/><text x="896" y="498" text-anchor="middle" class="math">z_s^S</text></g>
  </g>

  <g id="prototype-bank">
    <rect x="1060" y="65" width="220" height="112" rx="5" fill="#F8F5FA" stroke="#987EAB" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1170" y="95" text-anchor="middle" class="label" fill="#654980">Fixed prototypes</text>
    <text x="1170" y="120" text-anchor="middle" class="tiny">K-means · K centers per class</text>
    <circle cx="1130" cy="145" r="8" fill="#6B518A"/><circle cx="1170" cy="145" r="8" fill="#9379AD"/><circle cx="1210" cy="145" r="8" fill="#B29BC4"/>
  </g>
  <g id="online-prototype-evidence">
    <rect x="1060" y="258" width="190" height="102" rx="5" fill="#F8F5FA" stroke="#80629C" stroke-width="2"/>
    <text x="1155" y="301" text-anchor="middle" class="label" fill="#654980">Prototype evidence</text>
    <text x="1155" y="332" text-anchor="middle" class="small">Log-Mean-Exp</text>
  </g>
  <g id="reliability-gate">
    <rect x="1279" y="258" width="161" height="102" rx="5" fill="#F8F5FA" stroke="#80629C" stroke-width="2"/>
    <text x="1360" y="301" text-anchor="middle" class="label" fill="#654980">Reliability gate</text>
    <text x="1360" y="332" text-anchor="middle" class="small">adaptive weight</text>
  </g>
  <g id="strong-target-reconstruction">
    <rect x="1461" y="258" width="197" height="102" rx="5" fill="#FFF0EF" stroke="#C44C4E" stroke-width="2.5"/>
    <text x="1560" y="294" text-anchor="middle" class="label" fill="#AC3D42">Strong-view target</text>
    <text x="1560" y="322" text-anchor="middle" class="label" fill="#AC3D42">reconstruction</text>
    <text x="1560" y="345" text-anchor="middle" class="tiny">teacher + prototype</text>
  </g>

  <!-- The only modified distillation target is highlighted; other terms stay unchanged. -->
  <g id="objectives">
    <path d="M1060 449H1658" class="rule"/>
    <text x="1060" y="473" class="tiny">DISTILLATION</text>
    <g id="unchanged-targets"><text x="1060" y="521" class="label">Original targets</text><text x="1060" y="546" class="small">Weak-weak and cross-view KD</text></g>
    <g id="corrected-strong-strong"><rect x="1430" y="487" width="228" height="75" rx="5" fill="#FFF0EF" stroke="#C44C4E" stroke-width="2.2"/><text x="1544" y="517" text-anchor="middle" class="label" fill="#AC3D42">Strong-strong KD</text><text x="1544" y="543" text-anchor="middle" class="small">reconstructed target only</text></g>
    <text x="1060" y="603" class="tiny">Only the student is updated.</text>
  </g>
</svg>
