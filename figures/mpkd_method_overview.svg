<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="436.14" viewBox="0 0 1699 926" role="img" aria-labelledby="title desc">
  <title id="title">MPKD: Multi-center Prototype Knowledge Distillation</title>
  <desc id="desc">Left-to-right overview of two perturbation views, frozen teacher and trainable student, fixed multi-center prototypes, reliability-gated target reconstruction, and student optimization.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AAB4C2" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7755B5" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C94E4E" />
    </marker>
    <style>.redesign { font-family: Arial, Helvetica, sans-serif; fill: #253245; }
.r-head { font-size: 26px; font-weight: 700; }
.r-stage { font-size: 20px; font-weight: 700; fill: #667487; }
.r-label { font-size: 22px; font-weight: 600; }
.r-small { font-size: 19px; fill: #59677A; }
.r-math { font-size: 24px; font-weight: 600; fill: #26364A; }
.r-input { fill: #FFFFFF; stroke: #C9D2DD; stroke-width: 2; }
.r-teacher { fill: #F5F7F9; stroke: #8793A2; stroke-width: 2; stroke-dasharray: 8 6; }
.r-student { fill: #F0F6FD; stroke: #3D78B4; stroke-width: 2; }
.r-proto { fill: #F7F4FB; stroke: #7755A6; stroke-width: 2; }
.r-recon { fill: #FFF5F2; stroke: #C6534C; stroke-width: 2; }
.r-line { fill: none; stroke: #929EAC; stroke-width: 2.5; marker-end: url(#arrow-gray); }
.r-line-purple { fill: none; stroke: #7755A6; stroke-width: 2.7; marker-end: url(#arrow-purple); }
.r-flow-purple { fill: none; stroke: #7755A6; stroke-width: 2.7; }
.r-line-red { fill: none; stroke: #C6534C; stroke-width: 3; marker-end: url(#arrow-red); }
.r-dash { fill: none; stroke: #8793A2; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }</style>
  </defs>
  <g id="mpkd-redesign" class="redesign">
    <rect width="1699" height="926" fill="#FFFFFF" />
    <!-- Figure heading and stage labels -->
    <g id="redesign-heading">
      <text x="45" y="56" font-size="31" font-weight="700" fill="#202D3D">MPKD</text>
      <text x="151" y="55" font-size="21" fill="#59677A">Multi-center prototype knowledge distillation</text>
      <path d="M45 76 H1652" stroke="#D8DEE6" stroke-width="2" />
      <text x="48" y="112" class="r-stage">01  PERTURBATIONS</text>
      <text x="265" y="112" class="r-stage">02  TEACHER / STUDENT</text>
      <text x="635" y="112" class="r-stage">03  PROTOTYPE EVIDENCE</text>
      <text x="990" y="112" class="r-stage">04  TARGET RECTIFICATION</text>
    </g>
    <!-- Forward data flow; paths are kept behind the modules. -->
    <g id="redesign-dataflow">
      <path d="M205 238 H238 V242 H265" class="r-line" />
      <path d="M205 388 H225 V302 H265" class="r-line" />
      <path d="M205 238 H234 V548 H265" class="r-line" />
      <path d="M205 388 H244 V598 H265" class="r-line" />
      <path d="M555 350 H603 V248 H635" class="r-flow-purple" />
      <path d="M555 386 H615 V507 H635" class="r-flow-purple" />
      <path d="M555 292 H584 V150 H1515 V203" class="r-line" />
      <path d="M555 248 H580 V620 H965 V320 H990" class="r-dash" />
      <text x="650" y="655" class="r-small">teacher prediction cues</text>
      <path d="M950 565 H970 V480 H990" class="r-line-purple" />
      <path d="M950 565 H972 V570 H1218 V390 H1240" class="r-line-purple" />
      <path d="M1195 426 H1240" class="r-line-purple" />
      <path d="M545 628 H590 V674 H405 V748" class="r-line" />
      <path d="M1450 485 V692 H754 V792" class="r-line-red" />
    </g>
    <!-- Two input views -->
    <g id="redesign-views">
      <rect x="45" y="195" width="160" height="86" rx="5" class="r-input" />
      <rect x="45" y="195" width="7" height="86" fill="#668BA8" />
      <text x="68" y="229" class="r-label">Weak view</text>
      <text x="68" y="258" class="r-math">x<tspan baseline-shift="sub" font-size="15">w,i</tspan></text>
      <rect x="45" y="345" width="160" height="86" rx="5" class="r-input" />
      <rect x="45" y="345" width="7" height="86" fill="#C88455" />
      <text x="68" y="379" class="r-label">Strong view</text>
      <text x="68" y="408" class="r-math">x<tspan baseline-shift="sub" font-size="15">s,i</tspan></text>
    </g>
    <!-- Frozen teacher -->
    <g id="redesign-teacher">
      <rect x="265" y="160" width="290" height="255" rx="6" class="r-teacher" />
      <text x="287" y="195" class="r-head">Teacher T</text>
      <rect x="444" y="174" width="91" height="28" rx="4" fill="#E8ECF0" />
      <text x="458" y="194" font-size="15" font-weight="700" fill="#566273">FROZEN</text>
      <path d="M286 211 H534" stroke="#D3D9E0" stroke-width="1.5" />
      <text x="290" y="251" class="r-small">weak target</text>
      <text x="424" y="251" class="r-math">p̃<tspan baseline-shift="sub" font-size="14">w,i</tspan><tspan baseline-shift="super" font-size="14">T</tspan></text>
      <path d="M286 264 H534" stroke="#E0E4E9" stroke-width="1.3" />
      <text x="290" y="300" class="r-small">strong target</text>
      <text x="424" y="300" class="r-math">p̃<tspan baseline-shift="sub" font-size="14">s,i</tspan><tspan baseline-shift="super" font-size="14">T</tspan></text>
      <path d="M286 313 H534" stroke="#E0E4E9" stroke-width="1.3" />
      <text x="290" y="350" class="r-small">weak feature</text>
      <text x="424" y="350" class="r-math">f<tspan baseline-shift="sub" font-size="14">w,i</tspan><tspan baseline-shift="super" font-size="14">T</tspan></text>
      <text x="290" y="386" class="r-small">strong feature</text>
      <text x="424" y="386" class="r-math">f<tspan baseline-shift="sub" font-size="14">s,i</tspan><tspan baseline-shift="super" font-size="14">T</tspan></text>
    </g>
    <!-- Trainable student -->
    <g id="redesign-student">
      <rect x="265" y="480" width="290" height="185" rx="6" class="r-student" />
      <text x="287" y="516" class="r-head" fill="#315F91">Student S</text>
      <text x="454" y="515" font-size="15" font-weight="700" fill="#315F91">TRAINABLE</text>
      <path d="M286 532 H534" stroke="#D2DFED" stroke-width="1.5" />
      <text x="290" y="574" class="r-small">weak prediction</text>
      <text x="424" y="574" class="r-math">z<tspan baseline-shift="sub" font-size="14">w,i</tspan><tspan baseline-shift="super" font-size="14">S</tspan></text>
      <path d="M286 587 H534" stroke="#DAE5F0" stroke-width="1.3" />
      <text x="290" y="628" class="r-small">strong prediction</text>
      <text x="424" y="628" class="r-math">z<tspan baseline-shift="sub" font-size="14">s,i</tspan><tspan baseline-shift="super" font-size="14">S</tspan></text>
    </g>
    <!-- Compact offline prototype construction and online matching -->
    <g id="redesign-prototype-evidence">
      <rect x="635" y="160" width="315" height="430" rx="6" class="r-proto" />
      <text x="657" y="195" class="r-head" fill="#62478B">Multi-center prototypes</text>
      <rect x="657" y="211" width="82" height="26" rx="4" fill="#E9E2F2" />
      <text x="673" y="230" font-size="14" font-weight="700" fill="#62478B">OFFLINE</text>
      <path d="M635 248 H650" class="r-line-purple" />
      <text x="657" y="265" class="r-small">Reliable weak-view features</text>
      <path d="M790 274 V293" class="r-line-purple" />
      <rect x="694" y="299" width="197" height="43" rx="5" fill="#FFFFFF" stroke="#C8B9DB" stroke-width="1.5" />
      <text x="737" y="327" class="r-label" fill="#62478B">Spherical K-Means</text>
      <path d="M792 344 V362" class="r-line-purple" />
      <circle cx="750" cy="382" r="8" fill="#7755A6" />
      <circle cx="780" cy="382" r="8" fill="#A188BE" />
      <circle cx="810" cy="382" r="8" fill="#C1B1D2" />
      <text x="831" y="389" class="r-math">K</text>
      <text x="713" y="416" class="r-small">fixed prototypes per class</text>
      <path d="M657 431 H895 M925 431 H928" stroke="#D8CFE3" stroke-width="1.5" />
      <path d="M910 400 V455 H755 V480" class="r-line-purple" />
      <rect x="657" y="445" width="82" height="26" rx="4" fill="#E9E2F2" />
      <text x="673" y="464" font-size="14" font-weight="700" fill="#62478B">ONLINE</text>
      <path d="M635 507 H670" class="r-line-purple" />
      <rect x="670" y="484" width="111" height="46" rx="5" fill="#FFFFFF" stroke="#C8B9DB" stroke-width="1.5" />
      <text x="683" y="513" class="r-small">Similarity</text>
      <path d="M781 507 H798" class="r-line-purple" />
      <rect x="802" y="484" width="126" height="46" rx="5" fill="#FFFFFF" stroke="#C8B9DB" stroke-width="1.5" />
      <text x="812" y="513" font-size="16" font-weight="600" fill="#62478B">Log-Mean-Exp</text>
      <path d="M866 532 V548" class="r-line-purple" />
      <rect x="688" y="547" width="237" height="35" rx="5" fill="#FFFFFF" stroke="#C8B9DB" stroke-width="1.5" />
      <path d="M925 565 H950" class="r-flow-purple" />
      <text x="701" y="572" class="r-math">p<tspan baseline-shift="sub" font-size="14">i</tspan><tspan baseline-shift="super" font-size="14">proto</tspan></text>
      <text x="762" y="572" class="r-small">class distribution</text>
    </g>
    <!-- Sample-wise reliability control -->
    <g id="redesign-gate">
      <rect x="990" y="220" width="205" height="290" rx="6" class="r-proto" />
      <text x="1013" y="256" class="r-head" fill="#62478B">Reliability gate</text>
      <path d="M1012 273 H1173" stroke="#D8CFE3" stroke-width="1.5" />
      <text x="1020" y="316" class="r-math">u<tspan baseline-shift="sub" font-size="14">i</tspan></text>
      <text x="1090" y="316" class="r-math">a<tspan baseline-shift="sub" font-size="14">i</tspan><tspan baseline-shift="super" font-size="13">proto</tspan></text>
      <text x="1020" y="365" class="r-math">r<tspan baseline-shift="sub" font-size="14">i</tspan><tspan baseline-shift="super" font-size="13">proto</tspan></text>
      <text x="1090" y="365" class="r-math">q<tspan baseline-shift="sub" font-size="14">i</tspan></text>
      <path d="M1012 384 H1173" stroke="#D8CFE3" stroke-width="1.5" />
      <text x="1034" y="425" class="r-small">adaptive weight</text>
      <rect x="1041" y="441" width="103" height="48" rx="5" fill="#E9E2F2" stroke="#A58BBE" stroke-width="1.5" />
      <text x="1070" y="473" class="r-math">λ<tspan baseline-shift="sub" font-size="14">i</tspan></text>
    </g>
    <!-- Target reconstruction -->
    <g id="redesign-target-reconstruction">
      <rect x="1240" y="205" width="415" height="280" rx="6" class="r-recon" />
      <text x="1264" y="244" class="r-head" fill="#A3443D">Strong-view target</text>
      <text x="1264" y="274" class="r-head" fill="#A3443D">reconstruction</text>
      <path d="M1264 289 H1630" stroke="#E8C9C4" stroke-width="1.5" />
      <text x="1285" y="335" font-size="20" font-weight="600" fill="#713F3B">
        p̂<tspan baseline-shift="sub" font-size="13">s</tspan><tspan baseline-shift="super" font-size="13">T</tspan><tspan> = (1 − λ</tspan><tspan baseline-shift="sub" font-size="13">i</tspan><tspan>) p̃</tspan><tspan baseline-shift="sub" font-size="13">s</tspan><tspan baseline-shift="super" font-size="13">T</tspan></text>
      <text x="1318" y="370" font-size="20" font-weight="600" fill="#713F3B">
        + λ<tspan baseline-shift="sub" font-size="13">i</tspan><tspan> p</tspan><tspan baseline-shift="sub" font-size="13">i</tspan><tspan baseline-shift="super" font-size="13">proto</tspan></text>
      <rect x="1282" y="406" width="330" height="48" rx="5" fill="#F8E4E0" />
      <text x="1304" y="437" font-size="18" font-weight="700" fill="#A3443D">used only for strong–strong KD</text>
    </g>
    <!-- Compact objective band -->
    <g id="redesign-objective">
      <path d="M45 710 H1654" stroke="#D8DEE6" stroke-width="2" />
      <text x="48" y="748" class="r-stage">STUDENT OPTIMIZATION</text>
      <rect x="300" y="766" width="160" height="70" rx="5" class="r-student" />
      <text x="354" y="809" class="r-head" fill="#315F91">L<tspan baseline-shift="sub" font-size="15">CE</tspan></text>
      <rect x="500" y="754" width="360" height="94" rx="5" fill="#F5F7F9" stroke="#CAD2DC" stroke-width="1.8" />
      <text x="524" y="783" class="r-label">Within-view KD</text>
      <rect x="524" y="797" width="132" height="36" rx="4" fill="#FFFFFF" stroke="#CAD2DC" />
      <text x="562" y="821" class="r-small">weak–weak</text>
      <rect x="674" y="797" width="160" height="36" rx="4" fill="#F8E4E0" stroke="#C6534C" stroke-width="1.5" />
      <text x="691" y="821" font-size="19" font-weight="700" fill="#A3443D">strong–strong</text>
      <rect x="900" y="766" width="190" height="70" rx="5" fill="#F5F7F9" stroke="#CAD2DC" stroke-width="1.8" />
      <text x="930" y="809" class="r-label">Cross-view KD</text>
      <text x="1120" y="810" font-size="28" fill="#929EAC">→</text>
      <rect x="1160" y="766" width="170" height="70" rx="5" fill="#F5F7F9" stroke="#CAD2DC" stroke-width="1.8" />
      <text x="1202" y="809" class="r-head">L<tspan baseline-shift="sub" font-size="15">total</tspan></text>
      <path d="M460 801 H495" class="r-line" />
      <path d="M860 801 H895" class="r-line" />
      <path d="M1090 801 H1110" class="r-line" />
      <rect x="1380" y="766" width="220" height="70" rx="5" fill="#EAF2FA" stroke="#3D78B4" stroke-width="1.8" />
      <text x="1417" y="809" class="r-head" fill="#315F91">Update student</text>
      <path d="M1330 801 H1375" class="r-line" />
    </g>
  </g>
</svg>